html,body{margin:0;min-height:100%;background:#111720;color:#f1dfb8;font-family:Georgia,"Times New Roman",serif}
a{-webkit-tap-highlight-color:transparent}.wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center}
.scene{position:relative;width:min(100vw,179.178vh);aspect-ratio:2048/1143;background-image:var(--bg-img);background-position:center;background-size:100% 100%;background-repeat:no-repeat;overflow:hidden}
.home{position:absolute;left:2.1%;top:2.2%;z-index:10;display:inline-flex;align-items:center;gap:.4em;color:#f3dfb5;background:rgba(20,28,27,.90);border:1px solid #ae925e;border-radius:4px;padding:.6em .95em;text-decoration:none;font-size:clamp(11px,.92vw,17px);box-shadow:0 2px 10px #0007}
.home:hover,.home:focus-visible{background:#423220;outline:2px solid #c79a55;outline-offset:2px}
.slot{position:absolute;width:19.8%;height:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(7px,.8vw,16px);padding:.4% .65%}
.slot.top-left{left:18.05%;top:25.0%}.slot.top-middle{left:40.85%;top:25.0%}.slot.top-right{left:63.7%;top:25.0%}
.slot.bottom-left{left:18.05%;top:53.1%}.slot.bottom-middle{left:40.85%;top:53.1%}.slot.bottom-right{left:63.7%;top:53.1%}
.slot h2{font-size:clamp(12px,1.2vw,25px);line-height:1.14;margin:0;color:#302117;text-shadow:0 1px 1px #fff5;font-weight:700}
.slot .tool-link{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:clamp(25px,2.15vw,42px);width:87%;max-width:240px;padding:5px 9px;border:1px solid #af8852;border-radius:4px;background:linear-gradient(#765530,#4b301a);color:#f6e7c4;font-weight:700;font-size:clamp(10px,.75vw,16px);box-shadow:0 2px 8px #0006}
