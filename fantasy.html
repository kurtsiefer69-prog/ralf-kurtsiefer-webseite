.page::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(4,8,11,.22) 0%,transparent 30%,rgba(4,8,11,.01) 45%,rgba(5,10,13,.3) 57%,rgba(6,10,14,.88) 74%,rgba(6,10,14,.96) 100%)}
header{position:relative;flex:1;min-height:260px;text-align:center;display:flex;align-items:flex-start;justify-content:center;padding:30px 150px 0}
.brand{max-width:600px;text-shadow:0 3px 13px #000,0 1px 32px #000}
.brand .micro{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.33em;text-transform:uppercase;color:#dfc58d;font-weight:600}
.brand h1{font-size:clamp(38px,4.5vw,74px);font-weight:normal;letter-spacing:.10em;text-transform:uppercase;color:#f6e6c1;margin:5px 0 1px}
.brand .sub{font-size:clamp(14px,1.15vw,19px);color:#eddfc5;letter-spacing:.04em;margin:0}
.back{position:absolute;left:clamp(16px,3vw,58px);top:clamp(18px,2.5vw,32px);border:1px solid rgba(220,192,139,.6);border-radius:4px;background:rgba(8,15,20,.73);color:#eed9b3;text-decoration:none;padding:10px 18px;font-size:14px;box-shadow:0 3px 18px #0006;transition:background .2s}
.back:hover,.back:focus-visible{background:rgba(64,46,26,.9);outline:2px solid #e5c88f;outline-offset:2px}
.navigation{width:100%;padding:4px clamp(20px,5.6vw,112px) clamp(18px,3vw,34px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px}
.nav-section{width:100%;max-width:1500px}
.nav-section h2{display:flex;gap:9px;justify-content:center;align-items:center;margin:0 0 8px;color:#dfc79c;font-size:clamp(13px,1vw,17px);letter-spacing:.14em;text-transform:uppercase;font-family:Georgia,serif;font-weight:normal;text-shadow:0 2px 7px #000}
.ornament{font-size:10px;color:#ae8950;opacity:.9}
.buttons{display:flex;align-items:stretch;justify-content:center;flex-wrap:nowrap;gap:clamp(7px,.65vw,12px)}
.nav-button{min-height:44px;width:100%;max-width:240px;min-width:0;padding:9px 10px;cursor:pointer;border:1px solid #99764a;border-radius:4px;background:linear-gradient(180deg,rgba(61,50,35,.87),rgba(22,23,22,.94));box-shadow:inset 0 1px #f6e2b51e,0 2px 9px #0007;color:#f0dfc0;font-family:Georgia,serif;font-size:clamp(13px,1.05vw,18px);font-weight:600;white-space:nowrap;text-shadow:0 1px 2px #000;transition:transform .16s,background .16s,border-color .16s}
.nav-button:hover,.nav-button:focus-visible{transform:translateY(-2px);outline:2px solid #c4a675;outline-offset:1px;border-color:#e6c687;background:linear-gradient(180deg,rgba(112,80,41,.96),rgba(59,38,24,.96))}
.nav-button:active{transform:translateY(0)}
.notice{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);z-index:5;max-width:calc(100vw - 35px);padding:13px 20px;color:#f0dfbc;text-align:center;background:#161d1deF;border:1px solid #c9aa78;border-radius:5px;font-size:15px;box-shadow:0 7px 20px #0008;opacity:0;visibility:hidden;transition:opacity .2s, transform .2s,visibility .2s}
.notice.show{visibility:visible;opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){
.page::before{background-position:58% center}
header{min-height:270px;padding:76px 55px 10px}
.brand h1{font-size:clamp(37px,8vw,56px)}
.back{left:15px;top:15px;font-size:13px;padding:8px 10px}
.navigation{padding:15px 15px 32px;gap:22px}
.buttons{flex-wrap:wrap;gap:9px}
.nav-button{max-width:none;flex:1 1 28%;min-width:105px;font-size:16px;min-height:50px}
.nav-section h2{font-size:15px;letter-spacing:.07em;margin-bottom:10px}
.page::after{background:linear-gradient(180deg,rgba(4,8,11,.28) 0%,rgba(4,8,11,.35) 20%,rgba(4,8,11,.82) 39%,rgba(4,8,11,.94) 100%)}
}
@media(max-width:430px){.nav-button{flex-basis:43%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
